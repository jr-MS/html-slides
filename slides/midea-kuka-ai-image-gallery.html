    function audienceOf(x) {
      const s = (x.category + x.businessValue + x.scene).toLowerCase();
      if (s.includes('内部') || s.includes('产品') || s.includes('研发') || s.includes('用户调研')) return '内部';
      if (s.includes('b2b') || s.includes('售前') || s.includes('行业') || s.includes('楼宇')) return 'B2B';
      if (s.includes('售后') || s.includes('服务')) return '售后';
      if (s.includes('品牌') || s.includes('esg') || s.includes('招聘') || s.includes('投资者')) return '品牌';
      return '消费者';
    }
    function render() {
      const q = document.getElementById('q').value.toLowerCase();
      const c = cat.value, a = document.getElementById('aud').value, st = document.getElementById('status').value, lo = document.getElementById('layout').value;
      const filtered = DATA.filter(x => {
        const text = JSON.stringify(x).toLowerCase();
        const oks = Object.values(x.models).filter(m=>m.status==='ok').length;
        const missing = Object.values(x.models).some(m=>m.status!=='ok');
        return (!q || text.includes(q)) && (!c || x.category===c) && (!a || audienceOf(x)===a) && (!lo || layoutOf(x.size)===lo) && (!st || (st==='ok'?oks>0:missing));
      });
      grid.innerHTML = filtered.map(x => {
        const panels = Object.entries(x.models).map(([model,m]) => {
          const ok = m.status === 'ok';
          const cls = model.includes('MAI') ? 'pill kuka' : 'pill';
          return `<section class="panel"><div class="panel-title"><span>${model}</span><span>${ok?'generated':'pending/error'}</span></div><div class="imgwrap">${ok?`<img src="${m.path}" alt="${x.id} ${model}">`:`<div class="placeholder"><b>${model}</b><br>${m.http?('HTTP '+m.http):'Not generated yet'}<br>${model.includes('MAI')?'MAI data-plane route still needs confirmation; placeholder kept for model comparison.':'Waiting for generation.'}</div>`}</div></section>`;
        }).join('');
        return `<article class="card" data-id="${x.id}"><div class="card-head"><div class="meta"><span class="pill">${x.id}</span><span class="pill">${x.category}</span><span class="pill kuka">${x.size}</span><span class="pill">${audienceOf(x)}</span></div><h2>${x.scene}</h2><div class="value">${x.businessValue}</div></div><div class="compare">${panels}</div><div class="prompt"><details><summary>查看 / 复制 Prompt</summary><pre>${htmlEscape(x.prompt)}</pre><button class="copy" onclick="navigator.clipboard.writeText(DATA.find(d=>d.id==='${x.id}').prompt)">Copy prompt</button></details></div></article>`;
      }).join('');
    }
    function htmlEscape(s) { return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    ['q','cat','aud','status','layout'].forEach(id=>document.getElementById(id).addEventListener('input',render));
    render();
  </script>
</body>
</html>
